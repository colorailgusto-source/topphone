name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FLUTTER_VERSION: '3.44.1'
  JAVA_VERSION: '17'


jobs:

  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true


      - name: Get dependencies
        run: flutter pub get


      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings


      - name: Run tests
        run: flutter test




  build-apk:
    name: Build APK Debug
    needs: analyze-and-test
    runs-on: ubuntu-latest


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true


      - name: Get dependencies
        run: flutter pub get


      - name: Build APK Debug
        run: flutter build apk --debug




  build-web:
    name: Build Web Release
    needs: analyze-and-test
    runs-on: ubuntu-latest


    steps:


      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true


      - name: Get dependencies
        run: flutter pub get


      - name: Generate web index
        run: |
          chmod +x tool/build_web.sh
          ./tool/build_web.sh
        env:

          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}


      - name: Build Web Release
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }} \
            --dart-define=STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }} \
            --dart-define=FUNCTIONS_BASE_URL=${{ secrets.FUNCTIONS_BASE_URL }}


      - name: Prepare Vercel config
        run: |
          cp vercel.json build/web/vercel.json
          sed -i 's#"outputDirectory": "build/web"#"outputDirectory": "."#' build/web/vercel.json


      - name: Verify Vercel files
        run: |
          test -f build/web/vercel.json
          cat build/web/vercel.json


      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:

          name: web-build
          path: build/web
          include-hidden-files: true
          retention-days: 7




  deploy-vercel:

    name: Deploy to Vercel

    needs: build-web

    if: github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest


    steps:


      - name: Checkout code
        uses: actions/checkout@v4


      - name: Download Web artifact
        uses: actions/download-artifact@v4

        with:

          name: web-build
          path: build/web



      - name: Check final files
        run: |

          test -f build/web/vercel.json

          ls -la build/web



      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25

        with:

          vercel-token: ${{ secrets.VERCEL_TOKEN }}

          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}

          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_TOPPHONEWEB }}

          vercel-args: '--prod'

          working-directory: ./build/web

          vercel-scope: xboxtrio99-sudos-projects

          vercel-version: '56.2.0'