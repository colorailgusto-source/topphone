name: topphone
description: TopPhone - Vendita Smartphone
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.0
  go_router: ^13.0.0
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  badges: ^3.1.2
  shimmer: ^3.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  http: ^1.2.0
  image_picker: ^1.0.7
  fl_chart: ^0.67.0
  timeago: ^3.6.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.0
  flutter_stripe: ^13.0.0
  webview_flutter: ^4.10.0
  flutter_launcher_icons: ^0.14.4
  app_links: ^6.0.0
  url_launcher: ^6.2.6
  font_awesome_flutter: ^11.0.0
  in_app_review: ^2.0.9
  share_plus: ^12.0.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_icon.png"
  remove_alpha_ios: true
  background_color: "#0288D1"
  adaptive_icon_background: "#0288D1"
  adaptive_icon_foreground: "assets/images/logo.png"
